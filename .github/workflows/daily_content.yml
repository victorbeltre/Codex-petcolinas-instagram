name: PetColinas - Contenido Diario Automatico

on:
  schedule:
    # 9:00 AM hora Republica Dominicana (UTC-4) = 13:00 UTC
    # Todos los dias, incluyendo martes
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-y-publicar:
    name: OpenAI -> Instagram
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar imagen y caption
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_content.py

      - name: Commit y push de imagen y caption
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add post_del_dia.jpg caption.txt
          git diff --staged --quiet || git commit -m "Post automatico PetColinas $(date +'%Y-%m-%d')"
          git push

      - name: Esperar propagacion del CDN de GitHub
        run: sleep 15

      - name: Publicar en Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          IMAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/post_del_dia.jpg
        run: |
          CAPTION="$(cat caption.txt)"
          export CAPTION
          python publish_to_ig.py
